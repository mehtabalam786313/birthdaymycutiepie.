<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Duain For You 🤲💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Sacramento&family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background: radial-gradient(circle at center, #1a001a 0%, #0d000d 60%, #000000 100%);
            color: #fff;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .cinzel-title { font-family: 'Cinzel', serif; }
        .cursive-text { font-family: 'Sacramento', cursive; }

        .dua-card {
            background: linear-gradient(135deg, rgba(255, 105, 180, 0.15) 0%, rgba(255, 255, 255, 0.05) 100%);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 182, 193, 0.4);
            box-shadow: 0 20px 50px rgba(0,0,0,0.9), inset 0 0 30px rgba(255, 105, 180, 0.3);
            border-radius: 24px;
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 360px;
            width: 100%;
        }

        .image-box {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.6);
            border: 4px solid rgba(255, 192, 203, 0.8);
            margin-bottom: 20px;
        }
        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div class="dua-card">
        <!-- Image Box -->
        <div class="image-box">
            <img src="IMG_20260817_014644.jpg" alt="Special Picture">
        </div>

        <h1 class="cinzel-title text-xl text-pink-100 font-bold mb-3">
            Hamesha Khush Raho! ✨
        </h1>

        <!-- Duain -->
        <p class="text-pink-200 text-sm leading-relaxed mb-4">
            "Allah tala aap ki zindagi ko khushiyon, kamyabi aur sukoon se bhar de. Aap jahan bhi raho hamesha muskurati raho aur aap ki har nek khwahish poori ho. Ameen! 💖"
        </p>

        <!-- Final Surprise Button -->
        <a href="page6.html" class="mt-2 px-6 py-3 rounded-xl bg-gradient-to-r from-pink-500 to-purple-600 text-white font-bold text-xs shadow-lg hover:scale-105 transition-all">
            Click for a Final Surprise 🎁
        </a>
    </div>

</body>
</html>
