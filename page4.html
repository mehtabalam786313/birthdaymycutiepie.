<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Question 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Sacramento&family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background: radial-gradient(circle at center, #1a001a 0%, #0d000d 60%, #000000 100%);
            color: #fff;
            overflow: hidden;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }
        .cinzel-title { font-family: 'Cinzel', serif; }
        .cursive-text { font-family: 'Sacramento', cursive; }

        .question-card {
            background: linear-gradient(135deg, rgba(255, 105, 180, 0.15) 0%, rgba(255, 255, 255, 0.05) 100%);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 182, 193, 0.4);
            box-shadow: 0 20px 50px rgba(0,0,0,0.9), inset 0 0 30px rgba(255, 105, 180, 0.3);
            border-radius: 24px;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 350px;
            width: 100%;
            z-index: 10;
        }

        .btn-yes {
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            color: white;
            font-weight: 700;
            padding: 12px 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(236, 72, 153, 0.5);
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.4);
            cursor: pointer;
        }
        .btn-yes:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 25px rgba(236, 72, 153, 0.8);
        }

        .btn-no {
            background: rgba(255, 255, 255, 0.1);
            color: #ff99bb;
            font-weight: 700;
            padding: 12px 30px;
            border-radius: 12px;
            border: 1px solid rgba(255, 182, 193, 0.3);
            cursor: pointer;
            position: relative;
            transition: 0.15s ease-out;
        }
    </style>
</head>
<body>

    <div class="question-card">
        <h2 class="cursive-text text-4xl text-pink-300 mb-2">A Special Question</h2>
        <h1 class="cinzel-title text-2xl sm:text-3xl text-pink-100 font-bold mb-8 tracking-wider">
            Do You Love Me?
        </h1>

        <div class="flex items-center justify-center space-x-6 w-full relative h-20">
            <!-- Yes Button Linked to page5.html -->
            <button onclick="sayYes()" class="btn-yes text-base">
                Yes 💖
            </button>

            <!-- No Button (Runs away on touch/hover) -->
            <button id="noBtn" onmouseover="moveNoButton()" onclick="moveNoButton()" class="btn-no text-base">
                No ❌
            </button>
        </div>
    </div>

    <script>
        function sayYes() {
            // Successfully linking to page 5
            window.location.href = 'page5.html';
        }

        function moveNoButton() {
            const btn = document.getElementById('noBtn');
            const maxX = window.innerWidth - btn.offsetWidth - 40;
            const maxY = window.innerHeight - btn.offsetHeight - 40;
            
            const randomX = Math.random() * (maxX - 50) + 20;
            const randomY = Math.random() * (maxY - 50) + 20;

            btn.style.position = 'fixed';
            btn.style.left = randomX + 'px';
            btn.style.top = randomY + 'px';
        }
    </script>
</body>
</html>
