<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cut the Cake, Maria! 🎂✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Sacramento&family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background: radial-gradient(circle at center, #1a001a 0%, #0d000d 60%, #000000 100%);
            color: #fff;
            overflow: hidden;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px 15px;
            position: relative;
        }
        .cinzel-title { font-family: 'Cinzel', serif; }
        .cursive-name { font-family: 'Sacramento', cursive; }

        /* Canvas for Sky Fireworks */
        #skyCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
        }

        /* Panaflex Banner */
        .panaflex-banner {
            background: linear-gradient(135deg, rgba(122, 28, 67, 0.95) 0%, rgba(58, 9, 33, 0.98) 100%);
            border: 3px solid rgba(255, 182, 193, 0.8);
            box-shadow: 0 15px 40px rgba(0,0,0,0.9), inset 0 0 30px rgba(255, 105, 180, 0.6);
            border-radius: 16px;
            padding: 12px 20px;
            text-align: center;
            z-index: 10;
            max-width: 92%;
        }

        /* Realistic Cake Card */
        .real-cake-card {
            background: linear-gradient(135deg, rgba(255, 105, 180, 0.15) 0%, rgba(255, 255, 255, 0.05) 100%);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 182, 193, 0.4);
            box-shadow: 0 20px 50px rgba(0,0,0,0.9), inset 0 0 30px rgba(255, 105, 180, 0.3);
            border-radius: 24px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            cursor: pointer;
            transition: transform 0.3s ease;
            max-width: 300px;
            width: 100%;
        }
        .real-cake-card:hover { transform: scale(1.03); }

        .cake-img-box {
            position: relative;
            width: 190px;
            height: 190px;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.6);
            border: 4px solid rgba(255, 192, 203, 0.8);
        }
        .cake-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        .real-cake-card.cut img {
            transform: scale(1.12) rotate(6deg);
            filter: brightness(1.15);
        }

        .slice-overlay {
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.3);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        .real-cake-card.cut .slice-overlay {
            opacity: 1;
            background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.85) 50%, transparent 60%);
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 15px rgba(255, 105, 180, 0.4); }
            50% { box-shadow: 0 0 30px rgba(255, 105, 180, 0.9), 0 0 50px rgba(255, 182, 193, 0.6); }
        }
        .magical-btn { animation: pulseGlow 1.5s infinite ease-in-out; }

        /* Real Physical Paper Streamers / Ribbon Cannons */
        .party-streamer {
            position: fixed;
            bottom: 10px;
            width: 12px;
            height: 40px;
            border-radius: 4px;
            pointer-events: none;
            z-index: 30;
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
            animation: shootRibbon 1.6s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes shootRibbon {
            0% {
                transform: translate(0, 0) rotate(0deg) scale(0.3);
                opacity: 1;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translate(var(--destX), var(--destY)) rotate(720deg) scale(1.2);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Sky Fireworks Canvas -->
    <canvas id="skyCanvas"></canvas>

    <!-- Panaflex Top Banner -->
    <div class="panaflex-banner mt-2">
        <h1 class="cinzel-title text-xl sm:text-2xl text-pink-100 tracking-wider font-bold drop-shadow-[0_2px_10px_rgba(255,105,180,0.8)]">
            HAPPIEST BIRTHDAY MY Cutie 
        </h1>
        <p class="text-xs sm:text-sm text-pink-300 font-semibold tracking-wide mt-1 uppercase">
            🎂 Cut Cakes Using Your Finger as a Knife ✨
        </p>
    </div>

    <!-- Realistic Interactive Cake Section -->
    <div id="cakeCard" class="real-cake-card my-auto" onclick="cutTheCake()">
        <div id="instructionBadge" class="mb-3 bg-pink-500/20 border border-pink-400/40 px-4 py-1 rounded-full text-xs text-pink-200 tracking-wider font-bold animate-pulse">
           Celebrate a Special Day!
        </div>
        
        <div class="cake-img-box">
            <img src="https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=600&q=80" alt="Birthday Cake">
            <div class="slice-overlay"></div>
        </div>

        <div class="mt-3 text-center">
            <h3 class="cursive-name text-3xl text-pink-300">For Maria 💖</h3>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div id="nextSection" class="w-full text-center z-10 mb-2 opacity-0 transition-opacity duration-700 pointer-events-none">
        <a href="page4.html" class="inline-flex items-center space-x-2 px-8 py-3.5 rounded-xl bg-gradient-to-r from-pink-500 via-rose-500 to-purple-600 text-white font-bold text-xs sm:text-sm magical-btn hover:scale-105 active:scale-95 transition-all duration-300 border border-white/35">
            <span>✨ Click For Surprise ➔</span>
        </a>
    </div>

    <script>
        const canvas = document.getElementById('skyCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Sky Fireworks Class
        class Firework {
            constructor(startX, startY, targetX, targetY, color) {
                this.x = startX;
                this.y = startY;
                this.startX = startX;
                this.startY = startY;
                this.targetX = targetX;
                this.targetY = targetY;
                this.distanceToTarget = Math.hypot(targetX - startX, targetY - startY);
                this.distanceTraveled = 0;
                this.coordinates = [];
                this.angle = Math.atan2(targetY - startY, targetX - startX);
                this.speed = 12;
                this.acceleration = 1.05;
                this.color = color;
                this.brightness = Math.random() * 30 + 70;
            }
            update(index) {
                this.coordinates.pop();
                this.coordinates.unshift([this.x, this.y]);
                this.speed *= this.acceleration;
                let vx = Math.cos(this.angle) * this.speed;
                let vy = Math.sin(this.angle) * this.speed;
                this.distanceTraveled = Math.hypot(this.x - this.startX, this.y - this.startY);
                
                if (this.distanceTraveled >= this.distanceToTarget) {
                    createParticles(this.targetX, this.targetY, this.color);
                    fireworks.splice(index, 1);
                } else {
                    this.x += vx;
                    this.y += vy;
                }
            }
            draw() {
                ctx.beginPath();
                ctx.moveTo(this.coordinates[this.coordinates.length - 1]?.[0] || this.x, this.coordinates[this.coordinates.length - 1]?.[1] || this.y);
                ctx.lineTo(this.x, this.y);
                ctx.strokeStyle = `hsl(${this.color}, 100%, ${this.brightness}%)`;
                ctx.lineWidth = 3;
                ctx.stroke();
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.coordinates = [];
                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 10 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.friction = 0.95;
                this.gravity = 0.6;
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.01;
                this.color = color;
            }
            update(index) {
                this.coordinates.pop();
                this.coordinates.unshift([this.x, this.y]);
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
                if (this.alpha <= 0) particles.splice(index, 1);
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = `hsl(${this.color}, 100%, 60%)`;
                ctx.shadowBlur = 12;
                ctx.shadowColor = `hsl(${this.color}, 100%, 50%)`;
                ctx.fill();
                ctx.restore();
            }
        }

        let fireworks = [];
        let particles = [];
        let isHeavyBlast = false;

        function createParticles(x, y, color) {
            let particleCount = 100;
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function launchFirework() {
            let startX = canvas.width / 2;
            let startY = canvas.height;
            let targetX = Math.random() * (canvas.width - 200) + 100;
            let targetY = Math.random() * (canvas.height * 0.5);
            let color = Math.random() * 360;
            fireworks.push(new Firework(startX, startY, targetX, targetY, color));
        }

        // Automatic background rockets
        setInterval(() => {
            if (!isHeavyBlast) {
                launchFirework();
            }
        }, 700);

        function loop() {
            requestAnimationFrame(loop);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            fireworks.forEach((f, index) => {
                f.update(index);
                f.draw();
            });

            particles.forEach((p, index) => {
                p.update(index);
                p.draw();
            });
        }
        loop();

        // Function to shoot physical paper ribbons from left and right bottom corners
        function triggerSideCannons() {
            const colors = ['#ff0055', '#00ffcc', '#ffcc00', '#ff3399', '#00ff88', '#ff6600', '#9900ff'];

            // Left Side Streamers
            for (let i = 0; i < 20; i++) {
                let ribbon = document.createElement('div');
                ribbon.className = 'party-streamer';
                ribbon.style.left = '15px';
                ribbon.style.background = colors[Math.floor(Math.random() * colors.length)];
                
                let destX = Math.random() * (window.innerWidth * 0.4) + 50; // Shoot towards right/center
                let destY = -(Math.random() * (window.innerHeight * 0.6) + 150); // Shoot upwards
                
                ribbon.style.setProperty('--destX', destX + 'px');
                ribbon.style.setProperty('--destY', destY + 'px');
                
                document.body.appendChild(ribbon);
                setTimeout(() => ribbon.remove(), 1600);
            }

            // Right Side Streamers
            for (let i = 0; i < 20; i++) {
                let ribbon = document.createElement('div');
                ribbon.className = 'party-streamer';
                ribbon.style.right = '15px';
                ribbon.style.background = colors[Math.floor(Math.random() * colors.length)];
                
                let destX = -(Math.random() * (window.innerWidth * 0.4) + 50); // Shoot towards left/center
                let destY = -(Math.random() * (window.innerHeight * 0.6) + 150); // Shoot upwards
                
                ribbon.style.setProperty('--destX', destX + 'px');
                ribbon.style.setProperty('--destY', destY + 'px');
                
                document.body.appendChild(ribbon);
                setTimeout(() => ribbon.remove(), 1600);
            }
        }

        let hasCut = false;
        function cutTheCake() {
            if (hasCut) return;
            hasCut = true;

            const card = document.getElementById('cakeCard');
            card.classList.add('cut');

            isHeavyBlast = true;

            // Trigger physical side streamers immediately and loop them
            triggerSideCannons();
            let cannonInterval = setInterval(triggerSideCannons, 900);

            // Heavy sky fireworks barrage
            let heavyInterval = setInterval(() => {
                for(let i=0; i<5; i++) {
                    launchFirework();
                }
            }, 200);

            setTimeout(() => {
                clearInterval(heavyInterval);
                clearInterval(cannonInterval);
                isHeavyBlast = false;
            }, 6000);

            document.getElementById('instructionBadge').innerHTML = "Congrats To Complete 17 Years ✨";
            document.getElementById('instructionBadge').className = "mb-3 bg-green-500/20 border border-green-400/40 px-4 py-1 rounded-full text-xs text-green-200 tracking-wider font-bold";

            const nextSec = document.getElementById('nextSection');
            nextSec.style.opacity = '1';
            nextSec.style.pointerEvents = 'auto';
        }
    </script>
</body>
</html>
